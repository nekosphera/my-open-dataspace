name: Pruebas

# La puerta de calidad. Corre en cada empujón y en cada propuesta de cambio,
# y es lo mismo que corre antes de publicar una versión: una versión no puede
# pasar por una puerta distinta de la que pasa el trabajo diario.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unidad:
    name: Unidad y comprobaciones del árbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r app/requirements.txt -r federation/requirements.txt

      # jq lo necesitan las pruebas del federador por delta, que en una máquina
      # sin él se saltan en silencio. En CI no se saltan.
      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: pytest
        run: python -m pytest tests -v --ignore=tests/e2e

      - name: Ninguna prueba se ha saltado sin decirlo
        run: |
          saltadas=$(python -m pytest tests --ignore=tests/e2e -q 2>&1 | grep -oE '[0-9]+ skipped' || true)
          if [ -n "${saltadas}" ]; then
            echo "::warning::Se han saltado pruebas en CI: ${saltadas}"
          fi

  guiones:
    name: Guiones de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # SC1091 y SC1090: el federador hace `source` de un fichero de
          # entorno cuya ruta llega por variable. Eso es lo que permite
          # ejecutarlo suelto contra otra configuración, y shellcheck no
          # puede seguirlo por definición.
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 shellcheck --severity=warning --exclude=SC1091,SC1090

      - name: Los guiones arrancan con bash
        run: |
          for guion in $(find . -name '*.sh' -not -path './node_modules/*'); do
            bash -n "${guion}" || exit 1
          done


      # Sobre el árbol recién clonado, que es donde importa: una máquina
      # de desarrollo con core.filemode=false no registra `chmod +x` en el
      # índice, y quien clone se encuentra «Permission denied» en el
      # primer comando del README.
      - name: Los guiones se pueden ejecutar
        run: |
          fallos=0
          for guion in $(git ls-files '*.sh'); do
            if [ ! -x "${guion}" ]; then
              echo "::error file=${guion}::sin bit de ejecución en un clon limpio"
              fallos=1
            fi
          done
          exit "${fallos}"

  extremo-a-extremo:
    name: Recorrido completo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el nodo
        run: |
          cp .env.example .env
          # Contraseñas de usar y tirar, generadas aquí: un secreto escrito en
          # un flujo de trabajo es un secreto publicado.
          for clave in ODS_DB_PASSWORD ODS_KEYCLOAK_ADMIN_PASSWORD ODS_FUSEKI_ADMIN_PASSWORD; do
            valor=$(openssl rand -hex 16)
            sed -i "s|^${clave}=.*|${clave}=\"${valor}\"|" .env
          done
          sed -i 's|^ODS_ADMIN_EMAIL=.*|ODS_ADMIN_EMAIL="ci@example.invalid"|' .env
          docker compose up -d --build

      - name: El recorrido completo
        run: python tests/e2e/golden_path.py http://localhost:8080

      - name: Registros si algo ha fallado
        if: failure()
        run: docker compose logs --tail 200

      - name: Bajar
        if: always()
        run: docker compose down -v

# Eclipse Data Space Connector Configuration

# Connector Identity
edc.connector.name=Eclipse Data Space Connector
edc.connector.id=edc-connector-01

# API Configuration
edc.api.control.baseurl=http://localhost:8080
edc.api.control.auth.key=password

# Data Plane Configuration
web.http.port=9090
web.http.path=/dataplane

# Persistence
edc.persistence.datasourceName=dataspace

# Identity Configuration
edc.iam.endpoint=http://localhost:8089/identity
edc.iam.auth.key=password

# Protocol Configuration
web.http.protocol.port=9091
web.http.protocol.path=/protocol

# Connectors from which data offers are accepted
edc.connectors.validation.allow=*

# Allow non-EDC connector consumption
edc.dataplane.client=http://localhost:9090


# --- Management API (nuevo) ---
web.http.management.port=8080
web.http.management.path=/management

# (opcional pero muy recomendado) clave de API para Management
edc.api.auth.key=dev-secret

